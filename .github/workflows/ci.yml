name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check third-party notices
        run: npm run licenses:check

      - name: Check product metadata
        run: npm run metadata:check

      - name: Run tests
        run: npm test -- --run

      - name: Run type checks
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Check Agent Worker runtime
        run: npm run agent:worker-check

      - name: Smoke test application
        run: npm run smoke
