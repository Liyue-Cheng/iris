# electron-builder 配置（M5.5 临时打包 / M6 正式收口的基础）
#
# 参考 Marina 的同栈配置。图标见 build/icon.ico（由 build/icon.svg 经
# scripts/gen-icons.mjs 光栅化；buildResources=build 时 electron-builder 也会
# 自动采用同名文件）。三方声明由生成脚本维护并作为 extraResources 打包。
#
# 依赖纪律：dependencies 只留主进程运行时真正 require 的包（node-pty /
# chokidar / gray-matter / @xterm/headless / @xterm/addon-serialize）——
# renderer 侧全部被 vite 打进 out/renderer，留在 dependencies 只会增加包体积。

appId: com.liyue-cheng.iris
copyright: Copyright (c) 2026 程璃月

directories:
  # dist/ 在 .gitignore 内。输出按版本号分目录；重打同一版本前由
  # scripts/clean-release.mjs 先带重试地清掉该目录，避免复用目录里被占用的
  # win-unpacked\Iris.exe 让 electron-builder 无限重试而「卡住」。
  output: dist/release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.bin'

extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

asar: true
# node-pty 的 .node 原生二进制与 conpty 资源必须在 asar 外（进程加载器
# 读不了 asar 虚拟文件系统）
asarUnpack:
  - node_modules/node-pty/**

# 本机 node-gyp 工具链装不全（M3 已验证 node-pty 1.1.0 的 N-API prebuild
# 直接可用），跳过 electron-builder 默认的原生模块重建。
npmRebuild: false

# 本机实时防护会锁住 electron-builder 刚解压的 Electron 目录,rename 必
# EPERM。直接复用 node_modules 里现成的发行版,跳过下载+解压+rename。
electronDist: node_modules/electron/dist

win:
  icon: build/icon.ico
  target:
    # portable：免安装单 exe；nsis：标准安装程序（带卸载、开始菜单/桌面快捷方式）
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]

portable:
  artifactName: ${productName}-${version}-portable.exe

nsis:
  oneClick: false                       # 走向导式安装，而非一键静默
  perMachine: false                     # 装到当前用户，免 UAC 提权
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false       # 卸载保留用户数据
  license: LICENSE
  artifactName: ${productName}-${version}-setup.exe
