<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="Iris">
  <title>Iris</title>
  <!-- Horizontal lockup: mark + wordmark. For about box, README, splash. -->
  <defs>
    <linearGradient id="w-std" x1="100" y1="40" x2="100" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dac6f4"/>
      <stop offset="1" stop-color="#9a7bd4"/>
    </linearGradient>
    <linearGradient id="w-fall" x1="100" y1="76" x2="100" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1cbc9"/>
      <stop offset="1" stop-color="#d597a0"/>
    </linearGradient>
    <radialGradient id="w-pupil" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbd9a0"/>
      <stop offset="1" stop-color="#f0b65a"/>
    </radialGradient>
    <path id="w-pstd" d="M100 144 C 56 132 44 76 100 44 C 156 76 144 132 100 144 Z"/>
    <path id="w-pfall" d="M100 141 C 68 134 60 95 100 62 C 140 95 132 134 100 141 Z"/>
  </defs>

  <g transform="translate(0 0)">
    <g fill="url(#w-fall)" opacity="0.92">
      <use href="#w-pfall" transform="rotate(60 100 100)"/>
      <use href="#w-pfall" transform="rotate(180 100 100)"/>
      <use href="#w-pfall" transform="rotate(300 100 100)"/>
    </g>
    <g fill="url(#w-std)">
      <use href="#w-pstd" transform="rotate(0 100 100)"/>
      <use href="#w-pstd" transform="rotate(120 100 100)"/>
      <use href="#w-pstd" transform="rotate(240 100 100)"/>
    </g>
    <circle cx="100" cy="100" r="17" fill="url(#w-pupil)"/>
    <circle cx="95.5" cy="95.5" r="5" fill="#fff" opacity="0.45"/>
  </g>

  <text x="208" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="120" font-weight="600" letter-spacing="-2" fill="#c4a7e7">Iris</text>
</svg>
