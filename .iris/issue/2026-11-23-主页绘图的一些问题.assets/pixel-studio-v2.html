<!doctype html>
<html lang="zh-CN" data-scheme="dark">
<head>
<meta charset="utf-8">
<title>Iris 主页像素场景 v2 — 预览</title>
<style>
  :root {
    color-scheme: dark;
    /* 暗色（Rose Pine 系） */
    --pixel-ink: #0d0a13;
    --pixel-floor: #0c0912;
    --pixel-wall: #2b2233;
    --pixel-wall-dot: #342a3e;
    --pixel-sky: #141830;
    --pixel-city: #1e2239;
    --pixel-wood-dark: #241b28;
    --pixel-wood-face: #7a4e52;
    --pixel-wood-top: #a36a5f;
    --pixel-gold: #f2bc67;
    --pixel-glow: #ffe6b0;
    --pixel-cream: #ecd9bd;
    --pixel-mint: #7fc7a8;
    --pixel-mint-dark: #4e8f77;
    --pixel-rose: #dd7d94;
    --pixel-blue: #7fb3cf;
    --pixel-iris: #c4a7e7;
    --pixel-bezel: #15111c;
    --pixel-body: #211a29;
    --pixel-screen-bg: #191b32;
    --pixel-pane-doc: #1f2240;
    --pixel-pane-term: #14162a;
    --pixel-titlebar: #262a4a;
  }
  html[data-scheme='light'] {
    color-scheme: light;
    --pixel-ink: #463640;
    --pixel-floor: #d8c1a3;
    --pixel-wall: #f1e3cf;
    --pixel-wall-dot: #e7d5bc;
    --pixel-sky: #232b52;
    --pixel-city: #2b3159;
    --pixel-wood-dark: #8f5d52;
    --pixel-wood-face: #b07a63;
    --pixel-wood-top: #cf9478;
    --pixel-gold: #f2bc67;
    --pixel-glow: #ffe6b0;
    --pixel-cream: #f7e9d2;
    --pixel-mint: #5aa98c;
    --pixel-mint-dark: #3e7d66;
    --pixel-rose: #c95f7d;
    --pixel-blue: #4f8ea8;
    --pixel-iris: #8f6fc4;
    --pixel-bezel: #2a2130;
    --pixel-body: #332a3c;
    --pixel-screen-bg: #1c1e38;
    --pixel-pane-doc: #23264a;
    --pixel-pane-term: #161830;
    --pixel-titlebar: #2c3055;
  }

  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #191724;
    font: 13px/1.5 system-ui, sans-serif;
    color: #908caa;
    transition: background 200ms;
  }
  html[data-scheme='light'] body { background: #faf4ed; color: #575279; }
  .holder { width: min(92vw, 720px); }
  .note { margin-top: 10px; text-align: center; }
  button {
    font: inherit; cursor: pointer;
    background: transparent; color: inherit;
    border: 1px solid currentColor; border-radius: 4px; padding: 2px 10px;
  }

  .iris-pixel-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 11;
    overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--pixel-ink) 55%, transparent);
    border-radius: 6px;
    background: var(--pixel-wall);
    box-shadow: 0 24px 70px color-mix(in srgb, var(--pixel-ink) 34%, transparent);
  }
  .iris-pixel-art {
    display: block;
    width: 100%;
    height: 100%;
    shape-rendering: crispEdges;
  }

  .px-cursor { animation: px-blink 1.1s step-end infinite; }
  .px-star-a { animation: px-twinkle-a 7s step-end infinite; }
  .px-star-b { animation: px-twinkle-b 9s step-end infinite; }
  .px-city-win { animation: px-city-blink 12s step-end infinite; }
  .px-rain { animation: px-rain 1.5s steps(9, end) infinite; }
  .px-steam { animation: px-steam 3s steps(5, end) infinite; }
  .px-line {
    transform: scaleX(0);
    transform-box: fill-box;
    transform-origin: left center;
    animation: px-line 10s steps(6, end) infinite;
  }
  .px-char {
    opacity: 0;
    animation: px-char 10s step-end infinite;
  }
  .px-stamp {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: px-stamp 10s step-end infinite;
  }

  @keyframes px-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  @keyframes px-twinkle-a { 0%, 70% { opacity: 1; } 71%, 85% { opacity: 0.25; } 86%, 100% { opacity: 1; } }
  @keyframes px-twinkle-b { 0%, 20% { opacity: 0.3; } 21%, 60% { opacity: 1; } 61%, 88% { opacity: 0.3; } 89%, 100% { opacity: 0.3; } }
  @keyframes px-city-blink { 0%, 60% { opacity: 0.85; } 61%, 100% { opacity: 0.15; } }
  @keyframes px-rain {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(2px, 44px); }
  }
  @keyframes px-steam {
    0%   { opacity: 0; transform: translateY(0); }
    20%  { opacity: 0.7; }
    80%  { opacity: 0.45; }
    100% { opacity: 0; transform: translateY(-7px); }
  }
  @keyframes px-line {
    0%, 4%    { transform: scaleX(0); }
    26%       { transform: scaleX(1); }
    79%       { transform: scaleX(1); }
    80%, 100% { transform: scaleX(0); }
  }
  @keyframes px-char {
    0%, 2.5%   { opacity: 0; }
    3%, 79%    { opacity: 1; }
    80%, 100%  { opacity: 0; }
  }
  @keyframes px-stamp {
    0%, 29%   { opacity: 0; transform: scale(0.5); }
    30%       { opacity: 1; transform: scale(1); }
    79%       { opacity: 1; transform: scale(1); }
    80%, 100% { opacity: 0; transform: scale(0.5); }
  }

  @media (prefers-reduced-motion: reduce) {
    .iris-pixel-art * { animation: none !important; }
    .px-line { transform: scaleX(1); }
    .px-char,
    .px-stamp { opacity: 1; }
  }
</style>
</head>

  </div>
  <div class="note">
    160×110 像素栅格 · <button id="toggle" type="button">切换明暗</button>
  </div>
</div>
<script>
  const root = document.documentElement;
  if (location.hash === '#light') root.dataset.scheme = 'light';
  document.getElementById('toggle').addEventListener('click', () => {
    root.dataset.scheme = root.dataset.scheme === 'dark' ? 'light' : 'dark';
  });
</script>
</body>
